setting.combine-max-multi-build.name = 最大建造数
setting.combine-max-multi-build.description = 多倍建造单次最多可建造数
setting.combine-build-boost.name = 空建造位额外加速
setting.combine-build-boost.description = 建造速度额外乘以最大建造数除以当前建造数
setting.combine-conveyor-max-layers.name = 组合传送带最大堆叠层数
setting.combine-conveyor-max-layers.description = 同一格可覆盖的同种传送带/管道层数上限（层数 = 速度倍率，调整即时生效）